<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sommaire des articles de veille sur l'intelligence artificielle.">
<title>Veille IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Sommaire : une colonne, une recherche, puis la liste des articles du dépôt (générée automatiquement) */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --ink: #141b2b; --muted: #566078; --line: #d9dfe9;
  --accent: #2f5bff; --accent-soft: #e3e9ff; --signal: #e8a400;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d121c; --surface: #151c2a; --ink: #e6ebf4; --muted: #9aa5bd; --line: #26304a;
    --accent: #7d9bff; --accent-soft: #1c2747; --signal: #f2bb3a; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 4rem;
}
.wrap { max-width: 50rem; margin: 0 auto; }
header { padding-block: 4rem 2rem; display: flex; flex-direction: column; gap: 1rem; }
.eyebrow { font-family: var(--font-mono); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.6rem, 7vw, 4rem); letter-spacing: -0.02em; line-height: 1; margin: 0; }
.lead { color: var(--muted); font-size: 1.15rem; margin: 0; max-width: 36rem; }

.tools { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; align-items: center; justify-content: space-between; padding-block: 0.5rem 1rem; border-bottom: 1px solid var(--line); }
.search { position: relative; flex: 1 1 18rem; min-width: 0; }
.search input {
  width: 100%; font: inherit; font-size: 1rem; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 0.65rem 0.9rem;
}
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.count { font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }

ul.list { list-style: none; margin: 0; padding: 0; }
ul.list li { border-bottom: 1px solid var(--line); }
a.item {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.35rem 1.5rem;
  padding: 1.25rem 0.75rem; margin-inline: -0.75rem; border-radius: 8px;
  color: inherit; text-decoration: none;
}
a.item:hover { background: var(--accent-soft); }
a.item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.item h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.35rem; line-height: 1.2; margin: 0; text-wrap: balance; }
a.item:hover h2 { color: var(--accent); }
.item p { margin: 0; color: var(--muted); font-size: 0.97rem; grid-column: 1; }
.meta { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); grid-column: 2; grid-row: 1; text-align: right; white-space: nowrap; padding-top: 0.3rem; font-variant-numeric: tabular-nums; }
.file { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); opacity: 0.8; grid-column: 1; }
.badge { display: inline-block; margin-left: 0.5rem; font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--bg); background: var(--signal); padding: 0.1rem 0.4rem; border-radius: 4px; vertical-align: 0.25em; }

.state { padding: 2.5rem 0; color: var(--muted); }
.state a { color: var(--accent); }
.skeleton li { padding: 1.25rem 0; }
.skeleton .bar { height: 1.1rem; width: 60%; background: var(--line); border-radius: 4px; }
.skeleton .bar.short { width: 85%; height: 0.8rem; margin-top: 0.6rem; opacity: 0.6; }
@media (prefers-reduced-motion: no-preference) {
  .skeleton .bar { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
}
footer { margin-top: 3rem; font-size: 0.88rem; color: var(--muted); }
footer a { color: var(--accent); }
@media (max-width: 560px) {
  a.item { grid-template-columns: minmax(0, 1fr); }
  .meta { grid-column: 1; grid-row: auto; text-align: left; padding-top: 0; }
  header { padding-block: 3rem 1.5rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Sommaire</span>
    <h1>Veille IA</h1>
    <p class="lead">Mes articles de veille sur l'intelligence artificielle. Choisissez un article pour le lire.</p>
  </header>

  <div class="tools">
    <div class="search">
      <label for="q" class="eyebrow" style="position:absolute;left:-9999px">Rechercher un article</label>
      <input id="q" type="search" placeholder="Rechercher un article…" autocomplete="off">
    </div>
    <span class="count" id="count">Chargement…</span>
  </div>

  <ul class="list skeleton" id="list" aria-live="polite">
    <li><div class="bar"></div><div class="bar short"></div></li>
    <li><div class="bar"></div><div class="bar short"></div></li>
    <li><div class="bar"></div><div class="bar short"></div></li>
  </ul>
  <div class="state" id="state" hidden></div>

  <footer>La liste se met à jour toute seule : chaque nouvelle page <code>.html</code> ajoutée au dépôt <a id="repo-link" href="https://github.com/iamjaypi/VeilleIA">VeilleIA</a> apparaît ici.</footer>
</div>

<script>
(function () {
  // Dépôt déduit de l'adresse GitHub Pages (utilisateur.github.io/depot/), avec valeurs par défaut.
  var OWNER = "iamjaypi", REPO = "VeilleIA";
  var host = location.hostname, seg = location.pathname.split("/").filter(Boolean);
  if (/\.github\.io$/.test(host)) {
    OWNER = host.split(".")[0];
    if (seg.length && !/\.html?$/.test(seg[0])) REPO = seg[0];
  }
  var EXCLUDE = ["index.html", "404.html"];
  var API = "https://api.github.com/repos/" + OWNER + "/" + REPO;
  var CACHE_KEY = "veille-articles-v1";
  var NEW_DAYS = 7;

  var listEl = document.getElementById("list");
  var stateEl = document.getElementById("state");
  var countEl = document.getElementById("count");
  var qEl = document.getElementById("q");
  document.getElementById("repo-link").href = "https://github.com/" + OWNER + "/" + REPO;

  var articles = [];

  function readCache() {
    try {
      var c = JSON.parse(sessionStorage.getItem(CACHE_KEY));
      if (c && Date.now() - c.t < 5 * 60 * 1000) return c.items;
    } catch (e) {}
    return null;
  }
  function writeCache(items) {
    try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), items: items })); } catch (e) {}
  }

  function prettify(name) {
    var s = name.replace(/\.html?$/, "").replace(/[-_]+/g, " ");
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function getInfo(file) {
    var page = fetch(encodeURI(file.path), { cache: "no-cache" })
      .then(function (r) { return r.ok ? r.text() : ""; })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, "text/html");
        var t = doc.querySelector("title");
        var d = doc.querySelector('meta[name="description"]');
        var p = doc.querySelector(".lead, main p, p");
        return {
          title: t && t.textContent.trim() ? t.textContent.trim() : prettify(file.name),
          desc: d ? d.getAttribute("content").trim() : (p ? p.textContent.trim().slice(0, 220) : "")
        };
      })
      .catch(function () { return { title: prettify(file.name), desc: "" }; });
    var date = fetch(API + "/commits?per_page=1&path=" + encodeURIComponent(file.path))
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (c) { return c[0] ? c[0].commit.committer.date : null; })
      .catch(function () { return null; });
    return Promise.all([page, date]).then(function (v) {
      return { path: file.path, name: file.name, title: v[0].title, desc: v[0].desc, date: v[1] };
    });
  }

  function load() {
    var cached = readCache();
    if (cached) return Promise.resolve(cached);
    return fetch(API + "/contents/")
      .then(function (r) {
        if (!r.ok) throw new Error(r.status === 403 ? "limite" : "http");
        return r.json();
      })
      .then(function (files) {
        var pages = files.filter(function (f) {
          return f.type === "file" && /\.html?$/i.test(f.name) && EXCLUDE.indexOf(f.name.toLowerCase()) === -1;
        });
        return Promise.all(pages.map(getInfo));
      })
      .then(function (items) {
        items.sort(function (a, b) {
          if (a.date && b.date) return b.date.localeCompare(a.date);
          if (a.date) return -1;
          if (b.date) return 1;
          return a.title.localeCompare(b.title, "fr");
        });
        writeCache(items);
        return items;
      });
  }

  var fmt = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short", year: "numeric" });

  function norm(s) { return (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }

  function render() {
    var q = norm(qEl.value.trim());
    var shown = articles.filter(function (a) {
      return !q || norm(a.title + " " + a.desc + " " + a.name).indexOf(q) !== -1;
    });
    listEl.classList.remove("skeleton");
    listEl.innerHTML = "";
    shown.forEach(function (a) {
      var li = document.createElement("li");
      var link = document.createElement("a");
      link.className = "item";
      link.href = encodeURI(a.path);
      var h = document.createElement("h2");
      h.textContent = a.title;
      if (a.date && Date.now() - new Date(a.date) < NEW_DAYS * 864e5) {
        var b = document.createElement("span"); b.className = "badge"; b.textContent = "nouveau"; h.appendChild(b);
      }
      link.appendChild(h);
      var m = document.createElement("span");
      m.className = "meta";
      m.textContent = a.date ? fmt.format(new Date(a.date)) : "";
      link.appendChild(m);
      if (a.desc) { var p = document.createElement("p"); p.textContent = a.desc; link.appendChild(p); }
      var f = document.createElement("span"); f.className = "file"; f.textContent = a.name; link.appendChild(f);
      li.appendChild(link);
      listEl.appendChild(li);
    });
    var n = articles.length;
    countEl.textContent = q ? shown.length + " sur " + n + " article" + (n > 1 ? "s" : "")
                            : n + " article" + (n > 1 ? "s" : "");
    stateEl.hidden = !(n === 0 || shown.length === 0);
    if (n === 0) stateEl.textContent = "Aucun article pour l'instant. Ajoutez une page .html au dépôt pour la voir apparaître ici.";
    else if (shown.length === 0) stateEl.textContent = "Aucun article ne correspond à « " + qEl.value.trim() + " ».";
  }

  qEl.addEventListener("input", function () { if (articles.length) render(); });

  load().then(function (items) { articles = items; render(); })
    .catch(function (err) {
      listEl.hidden = true;
      countEl.textContent = "";
      stateEl.hidden = false;
      stateEl.innerHTML = (err.message === "limite"
        ? "GitHub limite temporairement le nombre de requêtes. Réessayez dans quelques minutes, ou "
        : "Impossible de charger la liste des articles. ") +
        '<a href="https://github.com/' + OWNER + "/" + REPO + '">voir les fichiers sur GitHub</a>.';
    });
})();
</script>
</body>
</html>
